version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fpt_virtual_campus_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpt_poly_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_campus_360}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpt_admin -d virtual_campus_360"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
